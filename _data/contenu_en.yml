faq:
  titre: Frequently asked
  titre_italique: questions.
  questions:
    - question: What kind of position are you looking for?
      reponse: "A civilian IT job: IT support technician, or systems & network
        technician or administrator. I am also open to work-study programmes
        that help me grow my skills."
    - question: Why leave the Gendarmerie?
      reponse: My contract as a volunteer gendarme gave me a first foothold in
        operational IT. I now want to commit to it fully, in an organisation
        where I can keep growing technically over the long term.
    - question: What does your military background bring to an IT role?
      reponse: Following procedures, handling stress and acting fast when a service
        is critical. These are exactly the reflexes expected in IT support and
        operations.
    - question: Where can you work?
      reponse: "I am based between the Eure and Seine-Maritime departments in
        Normandy, France, and I hold a driving licence. I currently work in the
        Yvelines, near Paris: positions in Normandy and in the Paris region are
        both of interest."
    - question: When are you available?
      reponse: Get in touch to discuss it. I will give you my availability date
        based on my current contract.
