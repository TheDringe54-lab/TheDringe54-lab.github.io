profil:
  titre: Serious, disciplined,
  titre_italique: curious.
  paragraphes:
    - "After three months of intensive military training, I now serve as a
      volunteer gendarme in the specialist role of *IT assistant*. My daily work,
      on a mostly Ubuntu (GendBuntu) fleet: preparing workstations, administering
      servers, managing access rights and backups, and supporting users, in an
      environment where tool availability really matters."
    - "I focus on infrastructure, cybersecurity, virtualisation and user support.
      I am looking for a civilian job where I can build on what the Gendarmerie
      taught me: rigour, team spirit and a strong sense of responsibility."
  citation: “Helping keep systems secure and digital tools performing at their best.”
