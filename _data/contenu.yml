faq:
  titre: Questions
  titre_italique: fréquentes.
  questions:
    - question: Quel type de poste recherchez-vous ?
      reponse: "Un emploi civil en informatique : technicien support, technicien ou
        administrateur systèmes & réseaux. Je suis aussi ouvert aux alternances
        qui me permettent de monter en compétences."
    - question: Pourquoi quitter la Gendarmerie ?
      reponse: Mon contrat de gendarme adjoint volontaire m'a permis de mettre un pied
        dans l'informatique opérationnelle. Je souhaite maintenant m'y consacrer
        pleinement, dans une structure où je pourrai évoluer techniquement sur
        le long terme.
    - question: Qu'apporte votre expérience militaire à un poste IT ?
      reponse: Le respect des procédures, la gestion du stress et la capacité à
        intervenir vite quand un service est critique. Ce sont exactement les
        réflexes attendus en support et en exploitation.
    - question: Où pouvez-vous travailler ?
      reponse: "Je suis basé entre l'Eure et la Seine-Maritime (Normandie) et
        titulaire du permis B. Je travaille actuellement dans les Yvelines : les
        postes en Normandie comme en Île-de-France m'intéressent."
    - question: Quand êtes-vous disponible ?
      reponse: "Contactez-moi pour en discuter : je vous indiquerai ma date de
        disponibilité en fonction de mon contrat actuel."
contact:
  titre: Un poste à
