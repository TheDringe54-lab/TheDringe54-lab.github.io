profil:
  titre: Sérieux, discipliné,
  titre_italique: curieux.
  paragraphes:
    - "Formé par trois mois de formation militaire intensive, je suis
      aujourd'hui gendarme adjoint volontaire, emploi particulier *assistant
      informaticien*. Mon quotidien, sur un parc majoritairement Ubuntu
      (GendBuntu) : préparer les postes, administrer les serveurs, gérer les
      droits et les sauvegardes, et accompagner les utilisateurs, là où la
      disponibilité des outils compte vraiment."
    - "Je me spécialise dans les infrastructures, la cybersécurité, la
      virtualisation et le support aux utilisateurs. Je recherche un emploi
      civil qui me permettrait de valoriser ce que la Gendarmerie m'a appris :
      rigueur, esprit d'équipe et sens des responsabilités."
  citation: « Contribuer à la sécurité des systèmes et à la performance des outils
    numériques. »
